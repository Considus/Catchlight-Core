name: CI

# Every push to main and every PR targeting main runs Core's checks twice over:
#
#   core-tests — `swift test` + `swift run coreverify` on macOS. The job name is the
#                one the iOS repo required while Core lived there, kept for continuity.
#   ios-tests  — the same XCTest suite on the iOS simulator, oldest supported runtime
#                and newest, because the apps run Core on iOS as well as macOS and a
#                CryptoKit or Foundation difference would only show there.
#   linux-tests — `swift test` + `swift run coreverify` in the official Swift image on
#                Linux, where Core uses swift-crypto in place of CryptoKit and
#                swift-corelibs-foundation in place of Apple's Foundation. The
#                known-answer vectors in EncryptionLayerTests must hold on both, so
#                compare its "Executed N tests" line with core-tests'.
#   windows-tests — the same two commands on Windows with the swift.org toolchain,
#                again on swift-crypto. Same count comparison.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core (swift test + coreverify)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: swift test
        run: swift test --enable-code-coverage

      - name: swift run coreverify
        run: swift run coreverify

  linux-tests:
    name: Core on Linux (swift test + coreverify)
    runs-on: ubuntu-24.04
    container:
      # swift:6.2.4-noble, pinned by digest like the actions.
      image: swift@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: linux-swift-6.2.4-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            linux-swift-6.2.4-spm-

      - name: swift test
        run: swift test

      - name: swift run coreverify
        run: swift run coreverify

  windows-tests:
    name: Core on Windows (swift test + coreverify)
    # windows-2022, not 2025: the 2025 image's Visual Studio 18 C++ library refuses any
    # Clang older than 20 (error STL1000), and Swift 6.2.4 ships Clang 19. Move both
    # together when the Swift version moves.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Swift 6.2.4
        # swift.org's installer, checked against a pinned SHA-256 before it runs (no
        # third-party action: the repo allows only GitHub's own and verified ones). To
        # move version, change both values together; the hash is `shasum -a 256` of
        # the downloaded .exe.
        shell: pwsh
        env:
          SWIFT_URL: https://download.swift.org/swift-6.2.4-release/windows10/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-windows10.exe
          SWIFT_SHA256: 222501d4a0ef6ec3b2f08b3e0055140bb3a5136527542239bb925f979689f4ad
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'swift.exe'
          Invoke-WebRequest -Uri $env:SWIFT_URL -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($hash -ne $env:SWIFT_SHA256) { throw "Swift installer hash $hash does not match the pinned value" }
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart','/log',(Join-Path $env:RUNNER_TEMP 'swift-install.log') -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Swift installer exited $($p.ExitCode)" }
          # The installer writes PATH and SDKROOT to the registry, which this shell and
          # later steps do not see; hand both on through GITHUB_PATH and GITHUB_ENV.
          $before = $env:Path -split ';'
          foreach ($level in 'Machine', 'User') {
            $vars = [Environment]::GetEnvironmentVariables($level)
            foreach ($entry in (($vars['Path'] ?? '') -split ';')) {
              if ($entry -and $before -notcontains $entry) { $entry | Out-File $env:GITHUB_PATH -Append -Encoding utf8 }
            }
            foreach ($name in $vars.Keys) {
              if ($name -ne 'Path' -and -not (Test-Path "Env:$name")) { "$name=$($vars[$name])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }

      - name: Swift version
        run: swift --version

      - name: swift test
        run: swift test

      - name: swift run coreverify
        run: swift run coreverify

  ios-tests:
    name: Core on iOS (xcodebuild test)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          - 'platform=iOS Simulator,name=iPhone 16,OS=latest'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image."
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XCODE"

      # xcodebuild waits about 60 seconds for the destination and then gives up.
      # On a fresh runner CoreSimulator can take longer than that to publish its
      # devices, and xcodebuild then lists no simulators at all and exits 70
      # ("Unable to find a device matching the provided destination specifier").
      # It hit both legs at random here (PR #3 and #4, 2026-10-03), and the same step
      # fixed it in Catchlight-AppleStorage (its PR #3). Asking
      # simctl first starts the service, and the loop waits until the leg's
      # iPhone 16 is listed. The matrix strings are required status checks on
      # main, so they stay as they are.
      - name: Wait for the simulator
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          WANT=$(sed -n 's/.*OS=\([^,]*\).*/\1/p' <<< "$DESTINATION")
          for _ in $(seq 1 36); do
            OS=$WANT
            # "latest" is the newest iOS runtime installed, so wait for ITS iPhone 16:
            # an older runtime's iPhone 16 appearing first would end the wait too soon.
            if [ "$WANT" = latest ]; then
              OS=$(xcrun simctl list runtimes available 2>&1 | sed -n 's/^iOS \([0-9.]*\) .*/\1/p' | sort -V | tail -1)
            fi
            LIST=$(xcrun simctl list devices available || true)
            awk -v h="-- iOS $OS --" '/^-- /{s=($0==h)} s' <<< "$LIST" | grep -q '^    iPhone 16 (' && FOUND=1
            [ -n "${FOUND:-}" ] && break
            sleep 5
          done
          grep -E '^-- iOS|^    iPhone 16 \(' <<< "$LIST" || true
          if [ -z "${FOUND:-}" ]; then
            echo "::error::No iPhone 16 simulator for OS=$WANT (runtime ${OS:-none}) after 3 minutes."
            exit 1
          fi

      - name: xcodebuild test
        run: |
          xcodebuild test \
            -scheme CatchlightCore-Package \
            -destination '${{ matrix.destination }}'
