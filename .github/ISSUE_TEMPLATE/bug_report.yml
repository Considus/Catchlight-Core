name: Bug report
description: Report a problem in Catchlight Core
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include your Privacy phrase, Take contents, or any
        personal data** — Catchlight is zero-knowledge and we never need it to help you.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: core-version
    attributes:
      label: Core version
      description: The tag or commit you built against (e.g. 1.0.0)
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "iOS 18.5 or macOS 15.8"
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: I have not included my Privacy phrase, Take contents, or other personal data.
          required: true
