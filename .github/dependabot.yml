version: 2
updates:
  # Core has no third-party package dependencies (Package.resolved is gitignored),
  # so the only pinned versions are the workflow actions' commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    ignore:
      # The review workflow pins this action by commit. A bump arrives only through a reviewed update.
      - dependency-name: "anthropics/claude-code-action"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
