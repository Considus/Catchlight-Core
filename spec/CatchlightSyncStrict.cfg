\* Control run: the strict invariant has no exemption for the edit-versus-delete
\* rule, so it must fail. A pass here would mean the model cannot see a loss.
CONSTANTS
    Dev = {d1, d2}
    NoVal = NoVal
    MaxTime = 2
    MaxResolves = 0
    MaxRaces = 0
    AllowBlobLag = FALSE
    EditWhileHeld = FALSE
    FixedPushStep1 = FALSE
    FixedUnverified = FALSE
    SerialSyncs = FALSE
    UpgradeStart = FALSE
    FixedRecords = FALSE
    FixedBuiltOn = FALSE
    FixedKeepDeletion = FALSE
    FixedPendingFile = FALSE
SPECIFICATION Spec
INVARIANTS NoSilentLossStrict
