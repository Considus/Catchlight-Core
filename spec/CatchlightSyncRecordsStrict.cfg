\* Control run with the per-Take sync record: the strict invariant has no exemption for the
\* edit-versus-delete rule, so it must fail. A pass here would mean the model cannot see a loss.
CONSTANTS
    Dev = {d1, d2}
    NoVal = NoVal
    MaxTime = 2
    MaxResolves = 0
    MaxRaces = 0
    AllowBlobLag = FALSE
    EditWhileHeld = FALSE
    FixedPushStep1 = FALSE
    FixedUnverified = TRUE
    SerialSyncs = FALSE
    UpgradeStart = FALSE
    FixedRecords = TRUE
    FixedBuiltOn = TRUE
    FixedKeepDeletion = TRUE
    FixedUnreadVersion = TRUE
SPECIFICATION Spec
INVARIANTS NoSilentLossStrict
