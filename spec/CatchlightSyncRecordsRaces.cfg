\* With the per-Take sync record and one lock race (two pushes past the advisory lock at once,
\* as cloud delay allows). Fails: a push can still write over another's upload unseen. The
\* record cannot tell that apart from an edit built on the upload without a field in the
\* synced manifest naming the version each upload was built on.
CONSTANTS
    Dev = {d1, d2}
    NoVal = NoVal
    MaxTime = 3
    MaxResolves = 2
    MaxRaces = 1
    AllowBlobLag = TRUE
    EditWhileHeld = FALSE
    FixedPushStep1 = FALSE
    FixedUnverified = TRUE
    SerialSyncs = FALSE
    UpgradeStart = FALSE
    FixedRecords = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentLoss
PROPERTIES NoResurrection
