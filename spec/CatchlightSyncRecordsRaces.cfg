\* With the per-Take sync record and one lock race (two pushes past the advisory lock at once,
\* as cloud delay allows). The record alone fails here: a push can write over another's upload
\* unseen, and the record cannot tell that from an edit built on the upload. With the manifest
\* entry's builtOn field (FixedBuiltOn) the device whose upload was left out sees it and shows a
\* conflict. Set FixedBuiltOn = FALSE to see the loss.
CONSTANTS
    Dev = {d1, d2}
    NoVal = NoVal
    MaxTime = 3
    MaxResolves = 2
    MaxRaces = 1
    AllowBlobLag = TRUE
    EditWhileHeld = FALSE
    FixedPushStep1 = FALSE
    FixedUnverified = TRUE
    SerialSyncs = FALSE
    UpgradeStart = FALSE
    FixedRecords = TRUE
    FixedBuiltOn = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentLoss
PROPERTIES NoResurrection
