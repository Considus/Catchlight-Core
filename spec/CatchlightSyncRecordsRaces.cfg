\* With the per-Take sync record and one lock race (two pushes past the advisory lock at once,
\* as cloud delay allows). The record alone loses an edit here: a push writes over another's
\* upload unseen, and the record cannot tell that from an edit built on the upload. The manifest
\* entry's builtOn field (FixedBuiltOn) closes that: the device whose upload was left out shows
\* a conflict (SyncBuiltOnTests). Set FixedBuiltOn = FALSE to see the loss.
\*
\* Still fails, on two race paths builtOn does not reach, both present without it:
\*   NoResurrection: the racing push writes its edit back over the other device's newer deletion
\*     after that device has seen the deletion listed and dropped its own record of it.
\*   NoSilentLoss (with NoResurrection left out): the racing push writes the Take's one file with
\*     an older version and is cancelled, so the listed version's content is gone; the other
\*     device shows it as couldn't-verify, the user edits on, and the next push replaces it.
CONSTANTS
    Dev = {d1, d2}
    NoVal = NoVal
    MaxTime = 3
    MaxResolves = 2
    MaxRaces = 1
    AllowBlobLag = TRUE
    EditWhileHeld = FALSE
    FixedPushStep1 = FALSE
    FixedUnverified = TRUE
    SerialSyncs = FALSE
    UpgradeStart = FALSE
    FixedRecords = TRUE
    FixedBuiltOn = TRUE
    FixedKeepDeletion = TRUE
    FixedPendingFile = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentLoss
PROPERTIES NoResurrection
