\* With the per-Take sync record and one lock race (two pushes past the advisory lock at once,
\* as cloud delay allows). Each fix below closes one way the race loses data; set it FALSE to see
\* that loss:
\*   FixedBuiltOn: a push writes over another's upload unseen; the manifest entry's builtOn lets
\*     the device whose upload was left out show a conflict (SyncBuiltOnTests).
\*   FixedKeepDeletion: a push writes an older edit back over a newer deletion after the deleting
\*     device has seen it listed; kept, the deletion refuses the edit and is sent again.
\*   FixedUnreadVersion: one push writes the Take's file and the other its entry, so the folder
\*     lists a version its file doesn't hold; a version shown only as couldn't-verify is never
\*     treated as had, so no push writes over it before the device holding it repairs the file,
\*     and it isn't shown again once acted on (SyncRaceFileAndDeletionTests).
CONSTANTS
    Dev = {d1, d2}
    NoVal = NoVal
    MaxTime = 3
    MaxResolves = 2
    MaxRaces = 1
    AllowBlobLag = TRUE
    EditWhileHeld = FALSE
    FixedPushStep1 = FALSE
    FixedUnverified = TRUE
    SerialSyncs = FALSE
    UpgradeStart = FALSE
    FixedRecords = TRUE
    FixedBuiltOn = TRUE
    FixedKeepDeletion = TRUE
    FixedUnreadVersion = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentLoss
PROPERTIES NoResurrection
