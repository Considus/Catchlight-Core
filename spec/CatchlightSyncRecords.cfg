\* With the per-Take sync record (FixedRecords): safety, two devices, three edits or deletions,
\* two conflict choices, no lock race (CatchlightSyncRecordsRaces.cfg has one). FixedUnverified
\* models the couldn't-verify queue fix in Catchlight-iOS (stale Recover refused).
\* EditWhileHeld is FALSE because the iOS app refuses edits to a Take waiting for a choice
\* (ConflictHoldingStore); TRUE finds the loss that guard exists to prevent.
CONSTANTS
    Dev = {d1, d2}
    NoVal = NoVal
    MaxTime = 3
    MaxResolves = 2
    MaxRaces = 0
    AllowBlobLag = TRUE
    EditWhileHeld = FALSE
    FixedPushStep1 = FALSE
    FixedUnverified = TRUE
    SerialSyncs = FALSE
    UpgradeStart = FALSE
    FixedRecords = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentLoss
PROPERTIES NoResurrection
